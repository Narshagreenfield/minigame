<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박살 공방</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1b1d21;--panel:#23262b;--ink:#f4f1e8;--dim:#9aa0a8;--hz:#ffd400;--red:#ff3b30;--hp:#3ddc84;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d21;--panel:#23262b;--ink:#f4f1e8}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;overflow:hidden}
.disp{font-family:"Black Han Sans","Noto Sans KR",sans-serif}
#start{position:absolute;inset:0;padding:max(24px,env(safe-area-inset-top)) 28px 96px;display:flex;flex-direction:column;gap:22px;background:repeating-linear-gradient(135deg,#1b1d21 0 28px,#1f2227 28px 56px);overflow:auto}
#start h1{font-size:clamp(44px,10vw,108px);line-height:1;margin:0;letter-spacing:-.02em}
#start h1 span{background:var(--hz);color:#111;padding:0 .15em}
#start p{margin:0;color:var(--dim)}
.form{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch;max-width:760px}
.drop{flex:0 0 220px;height:220px;border:3px dashed var(--hz);display:grid;place-items:center;text-align:center;cursor:pointer;background:#15171a;position:relative;overflow:hidden;font-weight:700}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;background:#15171a}
.drop input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.drop:focus-within{outline:3px solid var(--ink)}
.fld{flex:1 1 240px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.fld label{font-weight:700}
.fld input{font:inherit;font-size:20px;padding:14px;background:#15171a;color:var(--ink);border:2px solid #3a3f47}
.fld input:focus{outline:3px solid var(--hz);border-color:var(--hz)}
#go{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));font-size:28px;padding:14px 34px;background:var(--hz);color:#111;border:0;cursor:pointer;box-shadow:5px 5px 0 #000}
#go:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
#game{position:absolute;inset:0;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#game.on{display:flex}
#stage{flex:1;position:relative;min-width:0;background:radial-gradient(ellipse at 50% 65%,#3a3f47 0,#24272c 55%,#17191c 100%)}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#0000,#0008);pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:5}
#banner{position:absolute;top:0;left:0;right:0;z-index:5;display:none;text-align:center;font-size:clamp(26px,6.4vw,88px);line-height:1.15;padding:.18em .2em;color:#fff;background:repeating-linear-gradient(135deg,#c1121f 0 22px,#8f0d17 22px 44px);border-bottom:6px solid #fff;text-shadow:3px 3px 0 #000;animation:slam .35s cubic-bezier(.2,1.6,.4,1),blink .5s steps(2) .35s infinite}
#banner.on{display:block}
@keyframes slam{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{filter:brightness(1.5)}}
#hud{position:absolute;top:clamp(76px,15vh,130px);left:50%;transform:translateX(-50%);width:min(440px,86%);z-index:4}
#hud .nm{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;text-shadow:0 2px 0 #000}
.bar{position:relative;height:26px;background:#0d0e10;border:3px solid #f4f1e8;overflow:hidden}
#hpf{height:100%;width:100%;background:var(--hp);transition:width .25s,background .25s}
.bar i{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#000a}
#panel{width:clamp(176px,27vw,236px);background:var(--panel);border-left:6px solid var(--hz);padding:10px;display:grid;grid-template-columns:1fr 1fr;align-content:start;align-content:safe center;gap:10px;z-index:6;overflow-y:auto}
.wb{aspect-ratio:1;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-weight:700;color:var(--ink);background:#2f343b;border:3px solid #f4f1e8;cursor:pointer;box-shadow:4px 4px 0 #000;padding:2px}
.wb i{font-style:normal;font-size:clamp(22px,4.6vh,40px);line-height:1}
.wb b{font-size:clamp(11px,1.9vh,15px)}
.wb small{font-size:clamp(9px,1.5vh,11px);color:var(--dim)}
.wb:hover:not(:disabled){background:#3b4149}
.wb:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.wb:disabled{opacity:.35;cursor:not-allowed}
.wb.ult{background:#7a0f17;border-color:var(--hz)}
.wb:focus-visible{outline:3px solid var(--hz)}
#over{position:absolute;inset:0;z-index:8;display:none;place-items:center;text-align:center;background:#000a}
#over.on{display:grid}
#over h2{font-size:clamp(44px,10vw,110px);margin:0 0 6px;color:var(--hz);text-shadow:4px 4px 0 #000}
#over p{margin:0 0 22px;color:var(--ink)}
#over button{font:inherit;font-weight:700;font-size:20px;margin:0 6px;padding:12px 24px;border:0;cursor:pointer;background:var(--hz);color:#111;box-shadow:4px 4px 0 #000}
#over button.sec{background:#f4f1e8}
@media (prefers-reduced-motion:reduce){#banner{animation:none}}
#mute{position:absolute;top:10px;left:10px;z-index:7;font-size:22px;width:44px;height:44px;border:3px solid #f4f1e8;background:#2f343b;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 #000}
#tm{position:absolute;top:10px;right:12px;z-index:7;font-weight:700;font-size:18px;text-shadow:0 2px 0 #000;padding:6px 10px;background:#000a}
.wb{position:relative;overflow:hidden}
.wb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0)*100%);background:rgba(255,255,255,.28);pointer-events:none}
.tb{position:absolute;top:10px;z-index:7;font-size:22px;width:44px;height:44px;border:3px solid #f4f1e8;background:#2f343b;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 #000;padding:0}
.tb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.tb:focus-visible{outline:3px solid var(--hz)}
#homeb{left:62px}#setb{left:114px}
#mute2{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;left:auto;z-index:30}
#start h1,#start p,#start .form,#start .picker{position:relative;z-index:1}
#lcv{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.form,.picker{max-width:min(560px,100%)}
.fld{min-width:0}
#nm{width:100%;min-width:0}
.slot{flex:0 0 220px;display:flex;flex-direction:column;gap:8px}
.slot .drop{flex:0 0 220px}
.drop.on{border-style:solid;box-shadow:0 0 0 4px var(--hz)}
#dhint{color:var(--dim);font-size:13px;line-height:1.3;min-height:1em}
#rmimg{font:inherit;font-weight:700;padding:8px;border:0;background:#f4f1e8;color:#111;cursor:pointer;box-shadow:3px 3px 0 #000}
#rmimg:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
#rmimg:focus-visible{outline:3px solid var(--hz)}
.ptitle{font-weight:700;margin-bottom:8px}
.ptitle small{color:var(--dim);font-weight:500;margin-left:8px}
#defs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:#15171a;border:3px solid #3a3f47;cursor:pointer}
.chip img{width:52px;height:52px;object-fit:contain}
.chip i{font-style:normal;font-size:36px;line-height:52px;height:52px}
.chip:hover{background:#1e2126}
.chip.sel{border-color:var(--hz);background:#2a2a1c}
.chip:focus-visible{outline:3px solid var(--ink)}
.cdt{position:absolute;inset:0;display:grid;place-items:center;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:clamp(20px,3.6vh,30px);color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none;z-index:2}
.wb.cool:disabled{opacity:1;background:#1d2024}
.wb.cool:disabled>:not(.cdt){opacity:.3}
#rstb{left:166px}#musb{left:218px}
#musb2{position:fixed;top:max(12px,env(safe-area-inset-top));right:66px;left:auto;z-index:30}
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:#000b;padding:12px}
.modal.on{display:grid}
#mus{z-index:60}
.modal .box{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--panel);border:4px solid var(--hz);padding:16px 18px;box-shadow:6px 6px 0 #000}
.modal h3{margin:0 0 10px;font-size:28px;color:var(--hz)}
.modal .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0;font-weight:700}
.modal .row input[type=number]{width:140px;font:inherit;padding:6px 8px;background:#15171a;color:var(--ink);border:2px solid #3a3f47}
.modal .row input[type=range]{flex:1;max-width:220px}
.modal input:focus-visible,.modal button:focus-visible{outline:3px solid var(--hz)}
.modal small{color:var(--dim);display:block;margin-top:10px}
.modal .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal .btns button{flex:1;font:inherit;font-weight:700;font-size:18px;padding:10px;border:0;cursor:pointer;background:var(--hz);color:#111;box-shadow:3px 3px 0 #000}
.modal .btns .sec{background:#f4f1e8}
.modal .wide{width:100%;font:inherit;font-weight:700;padding:10px;border:0;background:#f4f1e8;color:#111;cursor:pointer;box-shadow:3px 3px 0 #000;margin:8px 0}
#wcfg{margin:8px 0;padding:8px;background:#1a1c20;border:2px solid #3a3f47}
.wg{display:grid;grid-template-columns:minmax(78px,1.3fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center;font-size:14px}
.wg .h{color:var(--dim);font-size:12px;font-weight:700}
.wg input{width:100%;min-width:0;font:inherit;font-size:14px;padding:4px 6px;background:#15171a;color:var(--ink);border:2px solid #3a3f47}
.wg .na{color:var(--dim);text-align:center}
.trk{display:flex;gap:10px;align-items:center;padding:8px 10px;border:3px solid #3a3f47;margin:6px 0;cursor:pointer;font-weight:700}
.trk.sel{border-color:var(--hz);background:#2a2a1c}
.trk small{margin:0}
.trk input{width:20px;height:20px;flex:none}
</style>
</head>
<body>
<section id="start">
  <canvas id="lcv" aria-hidden="true"></canvas>
  <button id="musb2" class="tb" aria-label="음악 설정" title="음악 설정">🎵</button>
  <button id="mute2" class="tb mb" aria-label="배경음 켜기/끄기">🔊</button>
  <h1 class="disp">박살 <span>공방</span></h1>
  <p>부술 대상을 고르거나 사진을 올리고 이름을 정하세요.</p>
  <p id="best" style="font-weight:700;color:var(--hz)"></p>
  <div class="form">
    <div class="slot">
      <label class="drop" id="drop"><input type="file" id="file" accept="image/*"><span id="dtxt">내 사진 업로드<br><small style="color:var(--dim)">클릭해서 파일 선택</small></span><img id="prev" alt="미리보기"></label>
      <small id="dhint"></small>
      <button id="rmimg" type="button" hidden>✕ 사진 제거</button>
    </div>
    <div class="fld"><label for="nm">오브젝트 이름</label><input id="nm" maxlength="14" placeholder="예: 구형 컴퓨터"><label style="display:flex;gap:8px;align-items:center;font-weight:700;margin-top:8px"><input type="checkbox" id="ctr" style="width:20px;height:20px;padding:0">반격 모드: 오브젝트가 가끔 반격해요</label></div>
  </div>
  <div class="picker" role="group" aria-label="기본 오브젝트 선택"><div class="ptitle">기본 오브젝트<small>선택하지 않으면 랜덤으로 정해져요</small></div><div id="defs"></div></div>
  <button id="go" class="disp">게임시작</button>
</section>

<section id="game">
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="mute" class="mb" aria-label="배경음 켜기/끄기">🔊</button><button id="homeb" class="tb" aria-label="메인 화면으로" title="메인 화면">🏠</button><button id="setb" class="tb" aria-label="설정" title="설정">⚙️</button><button id="rstb" class="tb" aria-label="처음부터 다시 시작" title="초기화 (다시 시작)">🔄</button><button id="musb" class="tb" aria-label="음악 설정" title="음악 설정">🎵</button><div id="tm">⏱ 0.0초</div>
    <div id="banner" class="disp">비상계엄을 선포합니다</div>
    <div id="hud"><div class="nm"><span id="hn"></span><span id="hp">100%</span></div><div class="bar"><div id="hpf"></div><i></i></div><div id="ub" style="display:none;margin-top:8px"><div class="nm"><span>내 체력</span><span id="uhp">100%</span></div><div class="bar"><div id="uf" style="height:100%;width:100%;background:#4aa8e0;transition:width .25s"></div></div><div id="stk" style="margin-top:6px;font-weight:700;color:#ff3b30;text-shadow:0 2px 0 #000;min-height:1.2em"></div></div></div>
    <div id="over"><div><h2 class="disp" id="ot">박살!</h2><p id="os"></p><p id="orc" style="margin:-12px 0 22px;font-weight:700;color:var(--hz)"></p><button id="again">다시 부수기</button><button id="home" class="sec">처음으로</button></div></div>
    <div id="cfg" class="modal" role="dialog" aria-modal="true" aria-label="게임 설정"><div class="box">
      <h3 class="disp">⚙ 게임 설정</h3>
      <div class="row"><label for="c_sc">오브젝트 크기 <b id="v_sc"></b></label><input type="range" id="c_sc" min="30" max="150" step="5"></div>
      <div class="row"><label for="c_hp">오브젝트 최대 체력</label><input type="number" id="c_hp" min="1" max="999999999" step="any"></div>
      <div class="row"><label for="c_chp">오브젝트 현재 체력</label><input type="number" id="c_chp" min="1" max="999999999" step="any"></div>
      <div class="row"><label for="c_um">내 최대 체력</label><input type="number" id="c_um" min="1" max="999999999" step="any"></div>
      <div class="row"><label for="c_hl">회복량</label><input type="number" id="c_hl" min="1" max="999999999" step="any"></div>
      <button type="button" class="wide" id="c_det" aria-expanded="false" aria-controls="wcfg">▾ 상세 설정 (무기별 크리티컬 · 공격력 · 쿨타임)</button>
      <div id="wcfg" hidden></div>
      <div class="row"><label for="c_dg" id="l_dg">오브젝트 회피율 (%)</label><input type="number" id="c_dg" min="0" max="95" step="any"></div>
      <div class="row"><label for="c_pd">내 회피율 (%)</label><input type="number" id="c_pd" min="0" max="95" step="any"></div>
      <div class="row"><label for="c_cp">반격 발동 확률 (%)</label><input type="number" id="c_cp" min="0" max="100" step="any"></div>
      <div class="row"><label for="c_cc">반격 크리티컬 확률 (%)</label><input type="number" id="c_cc" min="0" max="100" step="any"></div>
      <div class="row"><label for="c_cm">반격 대미지 배율 (%)</label><input type="number" id="c_cm" min="0" max="10000" step="any"></div>
      <div class="row"><label for="c_ctr">반격 모드</label><input type="checkbox" id="c_ctr" style="width:22px;height:22px"></div>
      <small>체력·공격력·쿨타임·회피율 등을 바꾸면 이번 게임은 최고기록에 저장되지 않습니다.</small>
      <div class="btns"><button id="c_ok">적용</button><button id="c_def" class="sec">기본값</button><button id="c_x" class="sec">닫기</button></div>
    </div></div>
  </div>
  <div id="panel">
    <button class="wb" data-w="punch"><i>👊</i><b>펀치</b><small>-3x9</small></button>
    <button class="wb" data-w="hammer"><i>🔨</i><b>망치</b><small>-35</small></button>
    <button class="wb" data-w="gun"><i>🔫</i><b>총</b><small>-2x30 확률</small></button>
    <button class="wb" data-w="whip"><i>➰</i><b>채찍</b><small>-25</small></button>
    <button class="wb" data-w="chop"><i>🥢</i><b>젓가락</b><small>-6x4</small></button>
    <button class="wb" data-w="protest"><i>🪧</i><b>시위</b><small>-30</small></button>
    <button class="wb" data-w="drum"><i>🛢️</i><b>드럼통</b><small>50%↓</small></button>
    <button class="wb" data-w="knife"><i>🔪</i><b>칼</b><small>-18x3</small></button>
    <button class="wb" data-w="missile"><i>🚀</i><b>미사일</b><small>-90</small></button>
    <button class="wb" data-w="car"><i>🚗</i><b>차량 충돌</b><small>-70</small></button>
    <button class="wb" data-w="cannon"><i>💥</i><b>대포 발사</b><small>-110</small></button>
    <button class="wb" data-w="trip"><i>🧱</i><b>담 넘기</b><small>-55</small></button>
    <button class="wb" data-w="nuke"><i>☢️</i><b>핵</b><small>-200</small></button>
    <button class="wb" data-w="heal"><i>💊</i><b>회복</b><small>체력 +250</small></button>
    <button class="wb ult" data-w="ult"><i>🚨</i><b>궁극기</b><small>확률</small></button>
  </div>
</section>

<div id="mus" class="modal" role="dialog" aria-modal="true" aria-label="음악 설정"><div class="box">
  <h3 class="disp">🎵 음악 설정</h3>
  <div id="trks" role="radiogroup" aria-label="배경음 선택"></div>
  <div class="row"><label for="m_vol">볼륨 <b id="v_vol"></b></label><input type="range" id="m_vol" min="0" max="100"></div>
  <small>곡을 고르면 바로 재생돼요. '랜덤'이면 시작할 때마다 무작위로 정해지고, 보스전에서는 보스용 곡 중에서 골라요.</small>
  <div class="btns"><button id="m_x" class="sec">닫기</button></div>
</div></div>
<script>
const $=id=>document.getElementById(id),R=Math.random;
const gcv=$('cv'),lcv=$('lcv');let cv=lcv,ctx=lcv.getContext('2d'),demo=true;   // demo=true: 로비 연출 / false: 실제 게임
let W=0,H=0,DPR=1,img=null,userImg=null,pName='';
/* ---------- 보스전 설정 (여기만 고치면 됩니다) ---------- */
const BOSS_NAMES=['이재명','리짜이밍'];   // 이 이름을 입력하고 시작하면 보스전
const LIM=999999999;                // 체력·회복량 상한
let BOSS_HP=3000,NORMAL_HP=1000,USER_MAX=750,HEAL_AMT=250;   // 보스 체력 / 일반 체력 / 내 최대 체력 / 회복량
/* 일반·보스별 기본값: dodge=오브젝트 회피율, pdodge=내 회피율, ctrP=반격 발동 확률, ctrC=반격 크리티컬 확률, ctrM=반격 대미지 배율 */
const MODE_DEF=b=>b?{dodge:.15,pdodge:.10,ctrP:.35,ctrC:.35,ctrM:1.5}:{dodge:.15,pdodge:.10,ctrP:.25,ctrC:.15,ctrM:1};

 try{const d=g.getImageData(0,0,S,S).data;let x0=S,y0=S,x1=-1,y1=-1;for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(d[(y*S+x)*4+3]>16){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}

/* ---------- setup ---------- */
function fit(){const r=cv.parentElement.getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(img){const nar=demo&&W<700,m=demo?(nar?Math.min(W*.3,H*.22):Math.min(W*.34,H*.42)):Math.min(W*.55,H*.46),k=Math.min(m/img.width,m/img.height)*(demo?1:objScale);o.w=img.width*k;o.h=img.height*k;o.x=W*(demo?(nar?.76:.64):.5);o.y=H*(demo?(nar?.4:.56):.62);o.hx=o.x;o.hy=o.y}}
addEventListener('resize',()=>{fit()});
function reset(quiet){gen++;act=0;mv=0;cdEnd={};cdDur={};const mx=boss?BOSS_HP:NORMAL_HP;Object.assign(o,{max:mx,hp:mx,sx:1,sy:1,vx:0,vy:0,vis:true,ds:1,rot:0,rc:0});cage=null;wall=null;uHp=USER_MAX;dealt=0;cStack=0;tStart=performance.now();counter=$('ctr').checked;$('ub').style.display=counter?'block':'none';uhud();cracks=[];fx=[];parts=[];pieces=[];busy=over=false;drum=ult=null;flash=shk=0;seaKeep=false;$('over').classList.remove('on');$('banner').classList.remove('on');fit();hud();refresh();if(boss&&!quiet){pop('BOSS 출현!',W/2,H*.3,'#ff3b30',72);tone(120,40,.8,'sawtooth',.3);shk=16}}
function hud(){const p=Math.round(o.hp/o.max*100);$('hp').textContent=Math.ceil(o.hp).toLocaleString()+' / '+o.max.toLocaleString();const f=$('hpf');f.style.width=p+'%';f.style.background=p>50?'#3ddc84':p>25?'#ffd400':'#ff3b30'}
const wbs=[...document.querySelectorAll('.wb')];
for(const b of wbs){const c=document.createElement('span');c.className='cdt';c.setAttribute('aria-hidden','true');b.appendChild(c);b._c=c}
function can(w){if(busy||over)return false;if(performance.now()<(cdEnd[w]||0))return false;if(w==='heal')return counter&&uHp<USER_MAX;if(mv>0)return false;if(w==='drum')return o.hp<=o.max*.5&&act===0;if(w==='ult'||w==='cannon'||w==='trip')return act===0;return true}
function refresh(){wbs.forEach(b=>{b.disabled=!can(b.dataset.w)})}
function tickCd(){const now=performance.now();for(const b of wbs){const w=b.dataset.w,r=(cdEnd[w]||0)-now;if(r>0){b.style.setProperty('--cd',Math.min(1,r/(cdDur[w]||1)).toFixed(3));const t=(r/1000).toFixed(1);if(b._t!==t){b._t=t;b._c.textContent=t}if(!b.classList.contains('cool'))b.classList.add('cool')}else if(b.classList.contains('cool')){b.classList.remove('cool');b._t='';b._c.textContent='';b.style.setProperty('--cd','0');refresh()}}}
function uhud(){$('uhp').textContent=Math.max(0,uHp).toLocaleString()+' / '+USER_MAX.toLocaleString();$('uf').style.width=Math.max(0,uHp)/USER_MAX*100+'%';$('stk').textContent=boss&&cStack>0?'🔥 반격 누적 x'+cStack+' · 받는 대미지 +'+Math.round(cStack*BOSS_STACK_UP*100)+'%':''}
function fight(A){const base=Math.round(A.base);if(base<=0)return;   // 대미지를 실제로 준 적이 없으면 반격할 이유가 없음
 /* 반격 대미지 = (그 무기로 오브젝트가 실제로 받은 대미지) x (반격 크리티컬이면 2, 아니면 1) [x 반격 배율 x (1+누적 증가율)] */
 const crit=R()<P.ctrC;let d=base*(crit?2:1)*P.ctrM;if(boss){d*=1+cStack*BOSS_STACK_UP;cStack++;uhud()}d=Math.max(1,Math.round(d));const ok=R()>=P.pdodge;
 pop(crit?'크리티컬 반격!':'반격!',o.x,o.y-o.h*.7,'#ff3b30',crit?66:56);jelly(.8,1.3,6);tone(crit?420:300,60,.4,'sawtooth',.3);
 later(()=>{if(over)return;if(ok){hurt=1;shk=crit?32:24;noise(.3,.6,1200);uHp-=d;uhud();pop('-'+d.toLocaleString(),W*.5,H*.4,'#ff3b30',44);jelly(1.3,.7,10)}else pop('피했다!',W*.5,H*.4,'#fff',44);if(uHp<=0){over=true;refresh();later(()=>{$('ot').textContent='패배';$('os').textContent=pName+' 의 반격에 쓰러졌습니다.';$('orc').textContent='';$('over').classList.add('on')},800)}else refresh()},500)}

/* ---------- audio ---------- */
let AC;const sfxOff=()=>!AC||AC.state!=='running'||(demo&&!bgm.on);function ac(){return AC||(AC=new(window.AudioContext||window.webkitAudioContext)())}
function tone(f1,f2,d,type='square',v=.15){if(sfxOff())return;try{const a=ac(),t=a.currentTime,s=a.createOscillator(),g=a.createGain();s.type=type;s.frequency.setValueAtTime(f1,t);s.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(g).connect(a.destination);s.start();s.stop(t+d)}catch(e){}}
function noise(d,v=.3,lp=1800){if(sfxOff())return;try{const a=ac(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(R()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start()}catch(e){}}
function sirenSnd(d){if(sfxOff())return;try{const a=ac(),t=a.currentTime,s=a.createOscillator(),g=a.createGain();s.type='sawtooth';g.gain.value=.07;s.connect(g).connect(a.destination);s.frequency.setValueAtTime(650,t);for(let i=0;i*.45<d;i++)s.frequency.linearRampToValueAtTime(i%2?650:1050,t+(i+1)*.45);s.start(t);s.stop(t+d)}catch(e){}}

const ease=x=>x<0?0:x>1?1:x*x*(3-2*x),lerp=(a,b,t)=>a+(b-a)*t;
function spark(x,y,n,cols,sp=500,life=.7){for(let i=0;i<n;i++){const a=R()*6.283,v=sp*(.3+R()*.9);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,t:0,life:life*(.5+R()),c:cols[(R()*cols.length)|0],s:3+R()*7,g:1100})}}
function ring(x,y,c,max=260){fx.push({t:0,dur:.45,draw(p){ctx.strokeStyle=c;ctx.globalAlpha=1-p;ctx.lineWidth=14*(1-p)+2;ctx.beginPath();ctx.arc(x,y,max*p,0,7);ctx.stroke();ctx.globalAlpha=1}})}

function crack(){} /* 금간 효과 제거됨 */
function dmg(n,px,py,small,A){
 if(demo){const c=R()<.2;pop(small?'-'+n:(c?'크리티컬! -':'-')+(c?n*2:n),px,py-20,c?'#ff3b30':'#ffd400',small?20:(c?44:34));return}   // 로비 연출: 숫자만 띄움

 if(o.hp<=0)shatter(px,py,1,A&&A.w);else refresh()}

function fillCfg(){cfgHp0=Math.max(1,Math.ceil(o.hp));cfgMax0=o.max;$('c_sc').value=pc(objScale);$('v_sc').textContent=pc(objScale)+'%';$('c_hp').value=o.max;$('c_chp').value=cfgHp0;$('c_um').value=USER_MAX;$('c_hl').value=HEAL_AMT;
 $('l_dg').textContent=boss?'보스 회피율 (%)':'오브젝트 회피율 (%)';$('c_dg').value=pc(P.dodge);$('c_pd').value=pc(P.pdodge);$('c_cp').value=pc(P.ctrP);$('c_cc').value=pc(P.ctrC);$('c_cm').value=pc(P.ctrM);$('c_ctr').checked=counter;
 document.querySelectorAll('#wcfg input[data-w]').forEach(i=>i.value=pc(WCFG[i.dataset.w][i.dataset.k]));['a_crit','a_dmg','a_cd'].forEach(id=>$(id).value='')}
function cfgShow(){musHide();fillCfg();$('cfg').classList.add('on');$('c_sc').focus()}
function cfgHide(){$('cfg').classList.remove('on')}
const snap=()=>JSON.stringify([o.max,Math.ceil(o.hp),USER_MAX,HEAL_AMT,P,WCFG]);
function cfgApply(){const before=snap();
 const sc=nv($('c_sc'),30,150,pc(objScale))/100,mh=Math.round(nv($('c_hp'),1,LIM,o.max)),ch=Math.round(nv($('c_chp'),1,LIM,cfgHp0)),um=Math.round(nv($('c_um'),1,LIM,USER_MAX)),hl=Math.round(nv($('c_hl'),1,LIM,HEAL_AMT));
 const maxCh=mh!==cfgMax0,hpCh=ch!==cfgHp0;
 if(Math.abs(sc-objScale)>.001){objScale=sc;fit()}
 if(mh!==o.max){o.max=mh;if(boss)BOSS_HP=mh;else NORMAL_HP=mh}
 if(!over){if(hpCh)o.hp=Math.min(ch,o.max);else if(maxCh)o.hp=o.max;else o.hp=Math.min(o.hp,o.max)}
 if(um!==USER_MAX){USER_MAX=um;uHp=um}else uHp=Math.min(uHp,USER_MAX);
 HEAL_AMT=hl;
 P.dodge=upd(P.dodge,$('c_dg'),0,95);P.pdodge=upd(P.pdodge,$('c_pd'),0,95);P.ctrP=upd(P.ctrP,$('c_cp'),0,100);P.ctrC=upd(P.ctrC,$('c_cc'),0,100);P.ctrM=upd(P.ctrM,$('c_cm'),0,10000);
 document.querySelectorAll('#wcfg input[data-w]').forEach(i=>{const[lo,hi]=LIMW[i.dataset.k],c=WCFG[i.dataset.w];c[i.dataset.k]=upd(c[i.dataset.k],i,lo,hi)});
 counter=$('c_ctr').checked;$('ctr').checked=counter;$('ub').style.display=counter?'block':'none';
 if(snap()!==before)tweaked=true;
 updHealLbl();hud();uhud();refresh();cfgHide()}
addEventListener('keydown',e=>{if(e.key==='Escape'){cfgHide();musHide()}});

/* ---------- 로비 연출: 선택한 오브젝트가 중앙 약간 오른쪽에서 랜덤 무기로 계속 맞는 장면 ---------- */
let lobT=1;
const LOBBY_W=['punch','hammer','gun','whip','chop','protest','knife','missile','car','cannon','trip'];
function setMode(d){demo=d;cv=d?lcv:gcv;ctx=cv.getContext('2d')}
function lobbyLoad(){if(!demo)return;img=cur().img;demoReset()}
function demoReset(){gen++;act=0;mv=0;Object.assign(o,{max:1,hp:1,sx:1,sy:1,vx:0,vy:0,vis:true,ds:1,rot:0,rc:0});cage=null;wall=null;cracks=[];fx=[];parts=[];pieces=[];busy=over=false;drum=ult=null;flash=shk=0;seaKeep=false;$('over').classList.remove('on');$('banner').classList.remove('on');fit();lobT=.8}
function lobbyTick(dt){if(!demo||!img)return;lobT-=dt;if(lobT>0||act||mv)return;lobT=.6+R()*1.2;const w=LOBBY_W[(R()*LOBBY_W.length)|0];curW=w;({punch,hammer,gun,whip,chop,protest,knife,missile,car,cannon,trip})[w]()}

/* ---------- 시작 ---------- */
(function init(){loadPrefs();buildMusUI();buildCfgUI();setMode(true);syncSel();showBest();bgmStart(false);running=true;last=performance.now();requestAnimationFrame(frame)})();
</script>
